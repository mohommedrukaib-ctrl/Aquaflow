<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In — {{ AQUAFLOW_SYSTEM_NAME }}</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --ui-bg: #f3f6f9;
            --ui-card: #ffffff;
            --ui-primary: #2563eb;
            --ui-primary-hover: #1d4ed8;
            --ui-text-main: #1e293b;
            --ui-text-muted: #64748b;
            --ui-border: #e2e8f0;
            --ui-input-bg: #f8fafc;
        }

        body {
            background-color: var(--ui-bg);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Inter', sans-serif;
            padding: 20px;
            margin: 0;
        }

        .login-wrapper {
            width: 100%;
            max-width: 420px;
        }

        .login-card {
            background: var(--ui-card);
            border-radius: 20px;
            padding: 48px 40px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.03), 0 2px 10px rgba(0, 0, 0, 0.02);
            border: 1px solid var(--ui-border);
        }

        .login-logo {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-bottom: 40px;
        }

        .login-icon {
            width: 40px;
            height: 40px;
            background: var(--ui-primary);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 22px;
            font-weight: 800;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
        }

        .brand-name {
            font-size: 24px;
            font-weight: 800;
            color: var(--ui-text-main);
            margin: 0;
            letter-spacing: -0.5px;
        }

        .form-label {
            font-size: 13px;
            font-weight: 600;
            color: var(--ui-text-main);
            margin-bottom: 8px;
        }

        .form-control {
            border-radius: 12px;
            padding: 14px 16px;
            background-color: var(--ui-input-bg);
            border: 1px solid var(--ui-border);
            color: var(--ui-text-main);
            font-size: 14px;
            transition: all 0.2s ease;
            box-shadow: none !important;
        }

        .form-control:focus {
            background-color: #ffffff;
            border-color: var(--ui-primary);
            box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.1) !important;
        }

        .btn-signin {
            background: var(--ui-primary);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 12px;
            font-weight: 600;
            width: 100%;
            font-size: 15px;
            margin-top: 10px;
            transition: all 0.2s ease;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.2);
        }

        .btn-signin:hover {
            background: var(--ui-primary-hover);
            transform: translateY(-1px);
            box-shadow: 0 6px 16px rgba(37, 99, 235, 0.3);
        }

        .custom-alert {
            background-color: #fff7ed;
            color: #ea580c;
            border: 1px solid #ffedd5;
            border-radius: 12px;
            padding: 14px 16px;
            font-size: 13px;
            font-weight: 500;
            display: flex;
            align-items: flex-start;
            gap: 12px;
            margin-bottom: 24px;
        }

        .custom-alert i { font-size: 16px; margin-top: 2px; }

        .footer-text {
            text-align: center;
            margin-top: 24px;
            font-size: 12px;
            color: var(--ui-text-muted);
            font-weight: 500;
        }
    </style>
</head>
<body>

<div class="login-wrapper">
    <div class="login-card">
        
        <div class="login-logo">
            <div class="login-icon">A</div>
            <h1 class="brand-name">AquaFlow</h1>
        </div>

        {% if messages %}
            {% for message in messages %}
                {% if message.tags == 'error' %}
                    <div class="custom-alert">
                        <i class="fas fa-exclamation-circle"></i>
                        <div>{{ message }}</div>
                    </div>
                {% endif %}
            {% endfor %}
        {% endif %}

        <form method="post" autocomplete="off">
            {% csrf_token %}

            <div class="mb-4">
                <label class="form-label">Username</label>
                <input type="text" name="username" class="form-control" placeholder="Enter username" autofocus required>
            </div>

            <div class="mb-4">
                <label class="form-label">Password</label>
                <input type="password" name="password" class="form-control" placeholder="Enter password" required>
            </div>

            <input type="hidden" name="next" value="{{ next }}">

            <button type="submit" class="btn-signin">
                Sign In
            </button>
        </form>
    </div>
    
    <div class="footer-text">
        Powered by {{ AQUAFLOW_DEVELOPER }} • v{{ AQUAFLOW_VERSION }}
    </div>
</div>

</body>
</html>
