<!DOCTYPE html>
<html lang="en" data-theme="light" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>500 — Server Error | AquaFlow</title>
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
    >
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    >
    <style>
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f0f4f8;
            font-family: 'Inter', system-ui, sans-serif;
            color: #1b2430;
        }
        .error-icon {
            font-size: 5rem;
            color: #d9342b;
            margin-bottom: 1.5rem;
        }
        .error-card {
            background: #fff;
            border-radius: 12px;
            padding: 3rem 2rem;
            box-shadow: 0 4px 24px rgba(0,0,0,0.08);
            max-width: 520px;
            text-align: center;
        }
        .btn-aqua {
            background: #0b7ec4;
            color: #fff;
            border: none;
            padding: 10px 24px;
            border-radius: 6px;
            text-decoration: none;
            display: inline-block;
        }
        .btn-aqua:hover {
            background: #096aa6;
            color: #fff;
        }
    </style>
</head>
<body>
    <div class="error-card">
        <div class="error-icon">
            <i class="fas fa-server"></i>
        </div>
        <h1 class="fw-bold mb-2">500 — Server Error</h1>
        <p class="text-muted mb-4">
            Something went wrong on our end. The error has been logged
            and our team has been notified. Please try again in a moment.
        </p>
        <a href="/" class="btn-aqua">
            <i class="fas fa-gauge-high me-2"></i>Back to Dashboard
        </a>
    </div>
</body>
</html>
